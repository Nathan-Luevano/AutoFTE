[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofte"
version = "0.2.0"
description = "Local-first crash triage, binary mitigation analysis, and LLM-assisted write-ups for fuzzing runs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Nathan Luevano" }]
keywords = ["fuzzing", "afl", "crash-triage", "binary-analysis", "security", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
autofte = "autofte.cli:main"

[tool.setuptools]
packages = ["autofte"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
