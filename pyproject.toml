[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofte"
version = "0.10.0"
description = "Local-first crash triage, binary mitigation analysis, and LLM-assisted write-ups for fuzzing runs"
readme = "PYPI.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nathan Luevano" }]
keywords = ["fuzzing", "afl", "crash-triage", "binary-analysis", "security", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.33.0"]

[project.urls]
Homepage = "https://github.com/Nathan-Luevano/AutoFTE"
Repository = "https://github.com/Nathan-Luevano/AutoFTE"
Issues = "https://github.com/Nathan-Luevano/AutoFTE/issues"

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-cov", "ruff"]

[project.scripts]
autofte = "autofte.cli:main"

[tool.setuptools]
packages = ["autofte"]
include-package-data = true

[tool.setuptools.package-data]
autofte = [
    "demo_assets/vuln-demo/Makefile",
    "demo_assets/vuln-demo/vuln.c",
    "demo_assets/vuln-demo/README.md",
    "demo_assets/vuln-demo/in/*",
    "demo_assets/vuln-demo/crashes/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
