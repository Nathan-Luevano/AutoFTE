name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system tools used by binary_analysis / triage
        # readelf/objdump/nm/ldd/file/strings ship with ubuntu-latest already;
        # gdb is not, and it's genuinely optional (triage.py falls back to
        # direct-run signal grouping without it). Installed best-effort so
        # any gdb-dependent test can run for real instead of skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb binutils

      - name: Install the package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check autofte tests

      - name: Run tests with coverage
        run: pytest -q --cov=autofte --cov-report=term-missing
